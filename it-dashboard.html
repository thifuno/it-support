<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Dashboard</title>
<style>
:root{--bg:#0b1220;--card:#141c2f;--text:#e5ecff;--muted:#95a7cf;--border:#2b395a;--primary:#3b82f6;--ok:#16a34a;--warn:#f59e0b;--danger:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;font-size:14px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:18px;font-weight:800;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.stat-n{font-size:26px;font-weight:700;line-height:1}
.stat-l{font-size:11px;color:var(--muted);margin-top:3px}
.filters{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{background:#11192c;border:1px solid var(--border);border-radius:9px;color:var(--text);padding:8px 10px;font-family:inherit;font-size:13px;outline:none}
.filters input{flex:1;min-width:160px}
.tkt-list{display:flex;flex-direction:column;gap:7px}
.tkt-row{background:var(--card);border:1.5px solid var(--border);border-radius:11px;padding:12px 13px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color .15s}
.tkt-row:hover{border-color:var(--primary)}
.tkt-id{font-family:monospace;font-size:11px;font-weight:700;color:#f97316;flex-shrink:0;min-width:66px}
.tkt-info{flex:1;min-width:0}
.tkt-info h4{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.tkt-info p{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkt-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.tkt-time{font-size:10px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid;white-space:nowrap}
.b-low{background:rgba(22,163,74,.15);color:#4ade80;border-color:rgba(22,163,74,.4)}
.b-med{background:rgba(245,158,11,.15);color:#fbbf24;border-color:rgba(245,158,11,.4)}
.b-high{background:rgba(239,68,68,.15);color:#f87171;border-color:rgba(239,68,68,.4)}
.b-open{background:rgba(59,130,246,.15);color:#60a5fa;border-color:rgba(59,130,246,.4)}
.b-prog{background:rgba(245,158,11,.15);color:#fbbf24;border-color:rgba(245,158,11,.4)}
.b-done{background:rgba(22,163,74,.15);color:#4ade80;border-color:rgba(22,163,74,.4)}
.b-closed{background:rgba(107,114,128,.15);color:#9ca3af;border-color:rgba(107,114,128,.4)}
.b-esc{background:rgba(239,68,68,.15);color:#f87171;border-color:rgba(239,68,68,.4)}
.empty{text-align:center;padding:48px;color:var(--muted)}
.loading{text-align:center;padding:40px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:10px}
.spin{width:18px;height:18px;border:2px solid rgba(59,130,246,.2);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;justify-content:center;align-items:flex-end}
.modal-bg.show{display:flex;animation:fi .15s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:18px 14px 36px;animation:su .2s ease}
@keyframes su{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(min-width:600px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:14px}}
.mhandle{width:32px;height:3px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.m-id{font-family:monospace;font-size:12px;color:#f97316;margin-bottom:2px}
.m-title{font-size:16px;font-weight:800}
.close-btn{width:28px;height:28px;border-radius:7px;background:#1e293b;border:1px solid var(--border);color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.ib{background:#1e293b;border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.ib-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.ib-v{font-size:12px;font-weight:600}
.desc-box{background:#1e293b;border:1px solid var(--border);border-radius:8px;padding:11px;font-size:13px;line-height:1.7;margin-bottom:12px;white-space:pre-wrap;color:var(--muted)}
.imgs-sec{margin-bottom:12px}
.imgs-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.imgs-grid{display:flex;flex-wrap:wrap;gap:7px}
.img-thumb{width:76px;height:76px;border-radius:7px;overflow:hidden;border:1px solid var(--border);cursor:pointer}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.act-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:7px}
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.act{padding:10px 8px;border-radius:8px;border:1.5px solid;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-align:center;-webkit-appearance:none;transition:opacity .15s}
.act:disabled{opacity:.5;cursor:not-allowed}
.a-prog{border-color:rgba(245,158,11,.5);color:#fbbf24;background:rgba(245,158,11,.12)}
.a-done{border-color:rgba(22,163,74,.5);color:#4ade80;background:rgba(22,163,74,.12)}
.a-closed{border-color:rgba(107,114,128,.5);color:#9ca3af;background:rgba(107,114,128,.12)}
.a-esc{border-color:rgba(239,68,68,.5);color:#f87171;background:rgba(239,68,68,.12)}
.note-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.note-row{display:flex;gap:7px;margin-bottom:8px}
.note-row textarea{flex:1;min-height:58px;font-size:12px;background:#1e293b;border:1.5px solid var(--border);border-radius:8px;padding:9px;color:var(--text);font-family:inherit;outline:none;resize:vertical}
.note-row textarea:focus{border-color:var(--primary)}
.btn-note{padding:7px 13px;background:var(--primary);border:none;border-radius:8px;color:white;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;align-self:flex-end}
.notes-list{display:flex;flex-direction:column;gap:6px}
.note-item{background:#1e293b;border-left:3px solid var(--primary);border-radius:0 7px 7px 0;padding:8px 11px;font-size:12px;line-height:1.6;color:var(--muted)}
.note-meta{font-size:10px;color:#475569;margin-bottom:2px}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;justify-content:center;align-items:center;padding:16px}
.lb.show{display:flex}
.lb img{max-width:100%;max-height:90vh;border-radius:8px;object-fit:contain}
.lb-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.12);border:none;color:white;font-size:18px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:all .25s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(22,163,74,.5);color:#4ade80}
.toast.err{border-color:rgba(239,68,68,.5);color:#f87171}
.hidden{display:none!important}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.act-grid{grid-template-columns:1fr 1fr}.info-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h2>🛠️ IT Dashboard</h2>
  <div class="stats">
    <div class="stat"><div class="stat-n" id="s0" style="color:#60a5fa">—</div><div class="stat-l">🔵 รอดำเนินการ</div></div>
    <div class="stat"><div class="stat-n" id="s1" style="color:#fbbf24">—</div><div class="stat-l">🟡 กำลังดำเนินการ</div></div>
    <div class="stat"><div class="stat-n" id="s2" style="color:#4ade80">—</div><div class="stat-l">🟢 แก้ไขแล้ว</div></div>
    <div class="stat"><div class="stat-n" id="s3" style="color:#f87171">—</div><div class="stat-l">🔴 ด่วนมาก</div></div>
  </div>
  <div class="filters">
    <select id="fStatus" onchange="render()">
      <option value="">ทุกสถานะ</option>
      <option value="open">🔵 รอดำเนินการ</option>
      <option value="prog">🟡 กำลังดำเนินการ</option>
      <option value="done">✅ แก้ไขแล้ว</option>
      <option value="closed">🔒 ปิด</option>
      <option value="esc">🔼 Escalated</option>
    </select>
    <input type="search" id="fQ" placeholder="🔍 ค้นหา Ticket ID / ชื่อ / หัวข้อ..." oninput="render()">
    <button onclick="loadTickets()" style="padding:8px 14px;background:var(--primary);border:none;border-radius:9px;color:white;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap">↻ รีเฟรช</button>
  </div>
  <div class="tkt-list" id="list"><div class="loading"><div class="spin"></div>กำลังโหลด...</div></div>
</div>

<div class="modal-bg" id="mbg" onclick="bgClose(event)">
  <div class="modal">
    <div class="mhandle"></div>
    <div class="mhead">
      <div><div class="m-id" id="m-id"></div><div class="m-title" id="m-title"></div></div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="info-grid">
      <div class="ib"><div class="ib-l">👤 ผู้แจ้ง</div><div class="ib-v" id="m-name"></div></div>
      <div class="ib"><div class="ib-l">🏢 แผนก</div><div class="ib-v" id="m-dept"></div></div>
      <div class="ib"><div class="ib-l">📞 ติดต่อ</div><div class="ib-v" id="m-contact"></div></div>
      <div class="ib"><div class="ib-l">📍 สถานที่</div><div class="ib-v" id="m-loc"></div></div>
      <div class="ib"><div class="ib-l">🔧 หมวดหมู่</div><div class="ib-v" id="m-cat"></div></div>
      <div class="ib"><div class="ib-l">📅 วันที่แจ้ง</div><div class="ib-v" id="m-date"></div></div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"><span id="m-pri"></span><span id="m-st"></span></div>
    <div class="desc-box" id="m-desc"></div>
    <div class="imgs-sec" id="imgs-sec" style="display:none">
      <div class="imgs-label">🖼️ รูปภาพ</div>
      <div class="imgs-grid" id="imgs-grid"></div>
    </div>
    <div class="act-label">🛠️ อัปเดตสถานะ</div>
    <div class="act-grid">
      <button class="act a-prog"   onclick="doUpdate('prog',  this)">🟡 รับงาน / กำลังแก้</button>
      <button class="act a-done"   onclick="doUpdate('done',  this)">✅ แก้ไขเสร็จแล้ว</button>
      <button class="act a-closed" onclick="doUpdate('closed',this)">🔒 ปิด Ticket</button>
      <button class="act a-esc"    onclick="doUpdate('esc',   this)">🔼 Escalate</button>
    </div>
    <div class="note-label">📝 บันทึกโน้ต IT</div>
    <div class="note-row">
      <textarea id="noteIn" placeholder="บันทึกการดำเนินงาน..."></textarea>
      <button class="btn-note" onclick="doNote(this)">บันทึก</button>
    </div>
    <div class="notes-list" id="notesList"></div>
  </div>
</div>

<div class="lb" id="lb" onclick="closeLb()">
  <button class="lb-close">✕</button>
  <img id="lb-img" src="" alt="">
</div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbw36gHsFu3-wkS2CwcDswHjI1cRZ5eZbcafJIyssI0yyt3tHNJPqyLQW47lm2bNZRYB/exec';
const sMap={open:'🔵 รอดำเนินการ',prog:'🟡 กำลังดำเนินการ',done:'✅ แก้ไขแล้ว',closed:'🔒 ปิด',esc:'🔼 Escalated'};
const sCls={open:'b-open',prog:'b-prog',done:'b-done',closed:'b-closed',esc:'b-esc'};
const pMap={low:'🟢 ปกติ',med:'🟡 เร่งด่วน',high:'🔴 ด่วนมาก'};
const pCls={low:'b-low',med:'b-med',high:'b-high'};
const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let tickets=[],openId=null;

async function loadTickets(){
  document.getElementById('list').innerHTML='<div class="loading"><div class="spin"></div>กำลังโหลด...</div>';
  try{
    const res=await fetch(API+'?action=list');
    const j=await res.json();
    if(!j.success)throw new Error(j.message);
    tickets=Array.isArray(j.data)?j.data:[];
    updStats();render();
    showToast('โหลดข้อมูลสำเร็จ '+tickets.length+' tickets','ok');
  }catch(e){
    document.getElementById('list').innerHTML='<div class="empty">⚠️ '+esc(e.message)+'</div>';
    showToast('❌ '+e.message,'err');
  }
}

function updStats(){
  document.getElementById('s0').textContent=tickets.filter(t=>t.status==='open').length;
  document.getElementById('s1').textContent=tickets.filter(t=>t.status==='prog').length;
  document.getElementById('s2').textContent=tickets.filter(t=>t.status==='done').length;
  document.getElementById('s3').textContent=tickets.filter(t=>t.priority==='high').length;
}

function render(){
  const fSt=document.getElementById('fStatus').value;
  const q=(document.getElementById('fQ').value||'').toLowerCase();
  const list=tickets.filter(t=>{
    if(fSt&&t.status!==fSt)return false;
    if(q)return (t.ticket_id||'').toLowerCase().includes(q)||(t.full_name||'').toLowerCase().includes(q)||(t.subject||'').toLowerCase().includes(q)||(t.contact||'').toLowerCase().includes(q);
    return true;
  });
  const el=document.getElementById('list');
  if(!list.length){el.innerHTML='<div class="empty">📭 ไม่พบ Ticket</div>';return}
  el.innerHTML=list.map((t,i)=>{
    const st=t.status||'open',pri=t.priority||'low';
    const hasImg=Array.isArray(t.images)&&t.images.length>0;
    const created=t.created_at?new Date(t.created_at).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):t.created_at||'—';
    return`<div class="tkt-row" onclick="openModal(${i})">
      <div class="tkt-id">${esc(t.ticket_id)}</div>
      <div class="tkt-info">
        <h4>${esc(t.subject||'—')}${hasImg?' 🖼️':''}</h4>
        <p>${esc(t.full_name||'—')} · ${esc(t.department||'—')} · ${esc(t.category||'—')}</p>
      </div>
      <div class="tkt-meta">
        <span class="badge ${pCls[pri]||'b-low'}">${pMap[pri]||pri}</span>
        <span class="badge ${sCls[st]||'b-open'}">${sMap[st]||st}</span>
        <span class="tkt-time">${esc(created)}</span>
      </div>
    </div>`;
  }).join('');
}

function getFiltered(){
  const fSt=document.getElementById('fStatus').value;
  const q=(document.getElementById('fQ').value||'').toLowerCase();
  return tickets.filter(t=>{
    if(fSt&&t.status!==fSt)return false;
    if(q)return (t.ticket_id||'').toLowerCase().includes(q)||(t.full_name||'').toLowerCase().includes(q)||(t.subject||'').toLowerCase().includes(q)||(t.contact||'').toLowerCase().includes(q);
    return true;
  });
}

function openModal(i){
  const t=getFiltered()[i];if(!t)return;
  openId=t.ticket_id;
  document.getElementById('m-id').textContent    =t.ticket_id||'—';
  document.getElementById('m-title').textContent =t.subject||'—';
  document.getElementById('m-name').textContent  =t.full_name||'—';
  document.getElementById('m-dept').textContent  =t.department||'—';
  document.getElementById('m-contact').textContent=t.contact||'—';
  document.getElementById('m-loc').textContent   =t.location||'—';
  document.getElementById('m-cat').textContent   =t.category||'—';
  const created=t.created_at?new Date(t.created_at).toLocaleString('th-TH',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}):t.created_at||'—';
  document.getElementById('m-date').textContent  =created;
  document.getElementById('m-desc').textContent  =t.description||'(ไม่มีรายละเอียด)';
  const st=t.status||'open',pri=t.priority||'low';
  document.getElementById('m-pri').outerHTML=`<span id="m-pri" class="badge ${pCls[pri]||'b-low'}">${pMap[pri]||pri}</span>`;
  document.getElementById('m-st').outerHTML =`<span id="m-st"  class="badge ${sCls[st]||'b-open'}">${sMap[st]||st}</span>`;
  // รูปภาพ
  const imgSec=document.getElementById('imgs-sec');
  try{
    let rawImgs=t.images||[];
    if(typeof rawImgs==='string'){try{rawImgs=JSON.parse(rawImgs)}catch(e){rawImgs=[]}}
    const imgs=Array.isArray(rawImgs)?rawImgs:[];
    if(imgs.length){
      document.getElementById('imgs-grid').innerHTML=imgs.map(s=>`<div class="img-thumb"><img src="${s}" onclick="openLb('${s}')"></div>`).join('');
      imgSec.style.display='block';
    }else{imgSec.style.display='none';}
  }catch(e){imgSec.style.display='none';}
  // notes
  const notes=Array.isArray(t.notes)?t.notes:[];
  document.getElementById('notesList').innerHTML=notes.map(n=>`<div class="note-item"><div class="note-meta">IT · ${esc(n.time||'')}</div>${esc(n.text||'')}</div>`).join('');
  document.getElementById('noteIn').value='';
  document.getElementById('mbg').classList.add('show');
  document.body.style.overflow='hidden';
}

function closeModal(){document.getElementById('mbg').classList.remove('show');document.body.style.overflow=''}
function bgClose(e){if(e.target===document.getElementById('mbg'))closeModal()}

async function doUpdate(status,btn){
  const orig=btn.textContent;
  btn.disabled=true;btn.textContent='⏳...';
  try{
    const url=`${API}?action=update&ticket_id=${encodeURIComponent(openId)}&status=${encodeURIComponent(status)}`;
    const res=await fetch(url);
    const j=await res.json();
    if(!j.success)throw new Error(j.message||'เกิดข้อผิดพลาด');
    showToast('✅ อัปเดตสถานะสำเร็จ','ok');
    await loadTickets();
    closeModal();
  }catch(e){showToast('❌ '+e.message,'err');}
  finally{btn.disabled=false;btn.textContent=orig;}
}

async function doNote(btn){
  const val=document.getElementById('noteIn').value.trim();
  if(!val)return;
  const orig=btn.textContent;
  btn.disabled=true;btn.textContent='⏳';
  try{
    const url=`${API}?action=update&ticket_id=${encodeURIComponent(openId)}&note=${encodeURIComponent(val)}`;
    const res=await fetch(url);
    const j=await res.json();
    if(!j.success)throw new Error(j.message||'เกิดข้อผิดพลาด');
    showToast('✅ บันทึกโน้ตสำเร็จ','ok');
    document.getElementById('noteIn').value='';
    await loadTickets();
    const idx=tickets.findIndex(x=>x.ticket_id===openId);
    if(idx>=0)openModal(idx);
  }catch(e){showToast('❌ '+e.message,'err');}
  finally{btn.disabled=false;btn.textContent=orig;}
}

function showToast(msg,type){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast '+type+' show';
  setTimeout(()=>el.className='toast',3500);
}
function openLb(src){document.getElementById('lb-img').src=src;document.getElementById('lb').classList.add('show');document.body.style.overflow='hidden'}
function closeLb(){document.getElementById('lb').classList.remove('show');document.body.style.overflow=''}

loadTickets();
setInterval(loadTickets,300000);
</script>
</body>
</html>
